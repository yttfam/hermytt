# Stateless Telegram <-> apytti router. Throwaway: replaces a future pyttch.daemon.
# Sync everywhere — matches pyttch's lib style, no tokio runtime.

[dependencies]
pyttch = { path = "../../pyttch", default-features = false }
ureq = { version = "3", features = ["json"] }
