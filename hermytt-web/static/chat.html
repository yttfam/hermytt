<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060610">
<title>chat — hermytt</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #060610; --bg-card: #0c0c1a; --bg-header: #10102a;
  --border: #1a1a3e; --border-bright: #2a2a5e;
  --text: #c8c8e0; --text-dim: #5a5a7e; --text-muted: #3a3a5e;
  --blue: #4a8af4; --green: #3ede7a; --red: #f06060;
  --yellow: #e8b030; --cyan: #30d0d0; --purple: #a070f0;
  --font: 'JetBrains Mono', monospace;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 12px; line-height: 1.5; display: flex; flex-direction: column; }
a { color: var(--blue); text-decoration: none; }

#hdr { background: var(--bg-header); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
#hdr .logo { font-size: 13px; font-weight: 700; letter-spacing: 1px; color: var(--text); }
#hdr .logo span { color: var(--text-muted); font-weight: 300; }
#hdr nav { display: flex; gap: 14px; font-size: 11px; }
#hdr nav a { color: var(--text-dim); }
#hdr nav a:hover, #hdr nav a.active { color: var(--blue); }
#hdr .right { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 11px; color: var(--text-dim); }
#hdr select, #hdr input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 4px 7px; font-family: var(--font); font-size: 11px; border-radius: 3px; outline: none; }
#hdr select:focus, #hdr input:focus { border-color: var(--blue); }
.btn { background: var(--bg-header); border: 1px solid var(--border); color: var(--text-dim); padding: 4px 10px; font-family: var(--font); font-size: 10px; border-radius: 3px; cursor: pointer; transition: all 0.1s; letter-spacing: 0.3px; }
.btn:hover { border-color: var(--border-bright); color: var(--text); }
.btn-blue { border-color: rgba(74,138,244,0.3); color: var(--blue); }
.btn-blue:hover { background: rgba(74,138,244,0.1); border-color: var(--blue); }

#status { background: rgba(48,208,208,0.06); border-bottom: 1px solid var(--border); padding: 6px 16px; font-size: 10px; color: var(--text-dim); display: none; }
#status.err { background: rgba(240,96,96,0.1); color: var(--red); }
#status.warn { background: rgba(232,176,48,0.1); color: var(--yellow); }
#status.show { display: block; }

main { flex: 1; display: grid; grid-template-columns: 280px 1fr; min-height: 0; }
#side { border-right: 1px solid var(--border); overflow: auto; background: var(--bg-card); }
#side .row { padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 11px; line-height: 1.35; }
#side .row:hover { background: var(--bg-header); }
#side .row.selected { background: rgba(74,138,244,0.08); border-left: 2px solid var(--blue); padding-left: 10px; }
#side .row .preview { color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#side .row .project { color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#side .row .preview-small { color: var(--text-dim); font-size: 10px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
#side .row .meta { color: var(--text-muted); font-size: 10px; margin-top: 3px; display: flex; justify-content: space-between; gap: 4px; }
#side .empty { padding: 32px 14px; color: var(--text-muted); font-style: italic; text-align: center; font-size: 11px; }

#main { display: flex; flex-direction: column; min-height: 0; }
#ctxbar { padding: 6px 16px; border-bottom: 1px solid var(--border); font-size: 10px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* contain:strict isolates the message list so layout/paint inside doesn't propagate up. Combined with content-visibility on each .msg, browser only computes the in-viewport rows. */
#msgs { flex: 1; overflow: auto; padding: 16px; min-height: 0; contain: strict; }
#msgs .empty { color: var(--text-muted); font-style: italic; text-align: center; padding: 60px 12px; font-size: 12px; }
/* Each message is its own paint/layout subtree so cursor moves in the textarea
   don't trigger document-wide relayout. content-visibility is gone — JS now
   only mounts the last VIEW_LIMIT bubbles, so we don't need it. */
.msg {
  margin-bottom: 16px;
  max-width: 920px;
  contain: layout paint style;
}
#msgs .load-older {
  display: block;
  width: 100%;
  margin: 0 0 16px 0;
  padding: 8px;
  background: var(--bg-header);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: var(--font);
  font-size: 11px;
  border-radius: 3px;
  cursor: pointer;
  text-align: center;
}
#msgs .load-older:hover { color: var(--text); border-color: var(--border-bright); }
.msg .role { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 4px; display: flex; gap: 8px; align-items: baseline; }
.msg .role .model { color: var(--text-dim); text-transform: none; letter-spacing: 0; font-size: 10px; }
.msg .role .ts { margin-left: auto; color: var(--text-muted); text-transform: none; letter-spacing: 0; font-size: 10px; cursor: help; }
.msg.user .role { color: var(--blue); }
.msg.assistant .role { color: var(--green); }
.msg .content { word-break: break-word; line-height: 1.6; }
/* Markdown elements inside .content. Vertical rhythm tuned for chat density —
   tighter than blog/article typography, but readable. */
.msg .content > *:first-child { margin-top: 0; }
.msg .content > *:last-child { margin-bottom: 0; }
.msg .content p { margin: 0 0 0.5em 0; }
.msg .content p:last-child { margin-bottom: 0; }
.msg .content h1, .msg .content h2, .msg .content h3, .msg .content h4 {
  font-weight: 600; color: var(--text); margin: 0.6em 0 0.3em 0; line-height: 1.3;
}
.msg .content h1 { font-size: 16px; }
.msg .content h2 { font-size: 14px; }
.msg .content h3 { font-size: 13px; }
.msg .content h4 { font-size: 12px; color: var(--text-dim); }
.msg .content ul, .msg .content ol { margin: 0.4em 0 0.4em 1.4em; padding: 0; }
.msg .content li { margin: 0.15em 0; }
.msg .content li > p { margin: 0; }
.msg .content blockquote {
  border-left: 2px solid var(--border-bright);
  margin: 0.5em 0; padding: 0.1em 0.8em;
  color: var(--text-dim); font-style: italic;
}
.msg .content code {
  font-family: var(--font); font-size: 0.92em;
  background: rgba(160,112,240,0.08);
  border: 1px solid rgba(160,112,240,0.2);
  padding: 0 4px; border-radius: 3px;
  color: var(--purple);
}
.msg .content pre {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 4px; padding: 10px 12px; margin: 0.6em 0;
  overflow-x: auto; max-width: 100%;
  font-family: var(--font); font-size: 11px; line-height: 1.5;
  color: var(--text);
}
.msg .content pre code {
  background: transparent; border: none; padding: 0; color: inherit;
}
.msg .content a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
.msg .content a:hover { color: #6aa6ff; }
.msg .content hr { border: none; border-top: 1px solid var(--border); margin: 0.8em 0; }
.msg .content table {
  border-collapse: collapse; margin: 0.5em 0;
  font-size: 11px; max-width: 100%;
  display: block; overflow-x: auto; white-space: nowrap;
}
.msg .content th, .msg .content td {
  border: 1px solid var(--border); padding: 4px 8px; text-align: left;
}
.msg .content th { background: var(--bg-header); font-weight: 600; color: var(--text); }
.msg .content tr:nth-child(even) td { background: rgba(255,255,255,0.015); }
.msg .content strong { color: var(--text); font-weight: 600; }
.msg .content em { color: var(--text); }
.msg .content del { color: var(--text-muted); }
.msg .tool-chip { display: inline-block; background: rgba(160,112,240,0.12); color: var(--purple); border: 1px solid rgba(160,112,240,0.3); border-radius: 3px; padding: 0 6px; font-size: 10px; margin: 0 2px; vertical-align: baseline; }
.msg .tool-chip.result { color: var(--text-dim); background: rgba(120,120,140,0.12); border-color: rgba(120,120,140,0.25); }
.msg .tool-uses { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.msg .tool-uses .tu { background: rgba(160,112,240,0.06); border: 1px solid rgba(160,112,240,0.2); border-radius: 3px; padding: 2px 8px; font-size: 10px; color: var(--text-dim); max-width: 600px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg .tool-uses .tu strong { color: var(--purple); margin-right: 6px; }
.msg .thinking { background: rgba(232,176,48,0.06); border-left: 2px solid var(--yellow); padding: 4px 8px; color: var(--text-dim); font-style: italic; font-size: 10px; display: inline-block; }

#attachments { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px; background: var(--bg-card); border-top: 1px solid var(--border); }
#attachments:not(:empty) { padding: 8px 16px 0 16px; }
.attachment-chip { display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px 3px 3px; font-size: 11px; max-width: 280px; }
.attachment-chip img { width: 32px; height: 32px; object-fit: cover; border-radius: 2px; flex-shrink: 0; }
.attachment-chip .icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: rgba(160,112,240,0.12); border-radius: 2px; flex-shrink: 0; font-size: 16px; }
.attachment-chip .name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attachment-chip .size { color: var(--text-muted); font-size: 10px; }
.attachment-chip .remove { cursor: pointer; color: var(--text-muted); font-size: 16px; line-height: 1; padding: 0 2px; user-select: none; }
.attachment-chip .remove:hover { color: var(--red); }
body.drag-over #composer { box-shadow: inset 0 0 0 2px var(--blue); background: rgba(74,138,244,0.05); }
#composer { border-top: 1px solid var(--border); padding: 10px 16px; display: flex; gap: 8px; align-items: end; background: var(--bg-card); }
#composer textarea { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; font-family: var(--font); font-size: 12px; border-radius: 3px; outline: none; resize: vertical; min-height: 44px; max-height: 200px; line-height: 1.45; }
#composer textarea:focus { border-color: var(--blue); }
#composer .btn-blue { padding: 8px 16px; font-size: 11px; cursor: pointer; transition: background 0.1s, border-color 0.1s, color 0.1s; }
/* During streaming the send button morphs into a red Stop. Aborting the local
   fetch closes the SSE stream; apytti's kill_on_drop SIGKILLs claude on disconnect. */
body.streaming #send {
  background: rgba(240,96,96,0.1);
  border-color: rgba(240,96,96,0.5);
  color: var(--red);
  cursor: pointer;
  pointer-events: auto;
  opacity: 1;
}
body.streaming #send:hover { background: rgba(240,96,96,0.2); border-color: var(--red); }
body.streaming #composer textarea { opacity: 0.7; cursor: progress; }

.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: middle; }
.dot-on { background: var(--green); }
.dot-off { background: #333; }

#noservers { padding: 60px 24px; color: var(--text-muted); text-align: center; font-size: 12px; line-height: 1.6; }

/* Hamburger button: hidden on desktop, visible on mobile. */
#btn-drawer {
  display: none;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 18px;
  width: 36px;
  height: 36px;
  border-radius: 4px;
  cursor: pointer;
  padding: 0;
  line-height: 1;
}
#btn-drawer:active { background: var(--bg-header); }

/* Drawer backdrop, only visible when sidebar slides in on mobile. */
#drawer-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 40;
}
body.drawer-open #drawer-backdrop { display: block; }

/* === Mobile === */
@media (max-width: 720px) {
  #hdr { padding: 8px 10px; gap: 8px; }
  #hdr .logo { font-size: 12px; }
  /* Hide secondary nav links and the right-side identity on small screens. */
  #hdr nav, #hdr .right { display: none; }
  #hdr select { font-size: 14px; padding: 6px 8px; min-width: 0; flex: 1; max-width: 50%; }
  #hdr button { font-size: 13px; padding: 6px 10px; min-height: 36px; }
  /* Hamburger appears, becomes the way to access the sidebar. */
  #btn-drawer { display: inline-block; }

  /* Main becomes single-column; sidebar slides in over the message pane. */
  main { grid-template-columns: 1fr; }
  #side {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 80vw;
    max-width: 320px;
    z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.22s ease-out;
    box-shadow: 4px 0 16px rgba(0,0,0,0.4);
    border-right: 1px solid var(--border);
  }
  body.drawer-open #side { transform: translateX(0); }

  /* Bigger tap targets in the sidebar list. */
  #side .row { padding: 10px 12px; }

  /* Composer: bigger font (≥16px prevents iOS Safari from auto-zooming on focus). */
  #composer { padding: 8px 10px; }
  #composer textarea {
    font-size: 16px;
    min-height: 44px;
    padding: 10px 12px;
  }
  #composer .btn-blue { padding: 10px 14px; font-size: 13px; min-height: 44px; }

  /* Conversation: tighter padding, allow long content to wrap. */
  #msgs { padding: 12px; }
  .msg { max-width: 100%; }
  .msg .content { font-size: 13px; }
  .msg .tool-uses .tu { max-width: 100%; }

  /* Context bar may overflow on a phone — keep it compact. */
  #ctxbar { padding: 4px 10px; font-size: 9px; }
}

@media (max-width: 380px) {
  /* Even tighter for the smallest phones. */
  #hdr select { font-size: 13px; }
  #hdr .logo { display: none; }
}
</style>
</head>
<body>

<div id="hdr">
  <button id="btn-drawer" aria-label="toggle sidebar">☰</button>
  <div class="logo">HER<span>MYTT</span></div>
  <nav>
    <a href="/terminal">terminal</a>
    <a href="/chat" class="active">chat</a>
    <a href="/admin">admin</a>
  </nav>
  <select id="server" title="apytti instance"></select>
  <select id="backend" title="backend"></select>
  <button class="btn btn-blue" id="btn-new" title="new conversation">+ new</button>
  <button class="btn" id="btn-refresh" title="refresh sessions">↻</button>
  <div class="right">
    <span id="whoami" style="color:var(--text-muted)"></span>
    <a href="#" onclick="logout();return false">logout</a>
  </div>
</div>
<div id="drawer-backdrop"></div>

<div id="status"></div>

<main>
  <div id="side"><div class="empty">loading…</div></div>
  <div id="main">
    <div id="ctxbar"></div>
    <div id="msgs"><div class="empty">pick a session on the left, or click + new</div></div>
    <div id="attachments"></div>
    <div id="composer">
      <textarea id="input" placeholder="message — Enter to send, Shift+Enter for newline"></textarea>
      <button class="btn-blue" id="send">Send</button>
    </div>
  </div>
</main>

<script src="/chat.js"></script>

</body>
</html>
