<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>hermytt</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #0a0a0a;
    font-family: monospace;
    overflow: hidden;
    touch-action: manipulation;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding-top: env(safe-area-inset-top, 0px);
  }
  #bar {
    background: #1a1a2e;
    color: #7f7f9f;
    padding: 6px 14px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #2a2a3e;
    flex-shrink: 0;
  }
  #bar .left { display: flex; align-items: center; gap: 12px; }
  #bar .name { color: #c0c0e0; font-weight: bold; }
  #bar a { color: #4a4a6e; text-decoration: none; transition: color 0.15s; }
  #bar a:hover { color: #60a5fa; }
  #bar .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #555;
    display: inline-block;
    margin-right: 6px;
    transition: background 0.3s;
  }
  #bar .dot.on { background: #4ade80; }
  #tabs {
    background: #12121f;
    display: flex;
    align-items: center;
    gap: 0;
    border-bottom: 1px solid #2a2a3e;
    flex-shrink: 0;
    overflow-x: auto;
  }
  .tab {
    padding: 6px 16px;
    color: #6f6f8f;
    cursor: pointer;
    border-right: 1px solid #1a1a2e;
    font-size: 13px;
    white-space: nowrap;
    user-select: none;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tab:hover { background: #1a1a2e; color: #9f9fbf; }
  .tab.active { background: #0a0a0a; color: #e0e0e0; border-bottom: 2px solid #60a5fa; }
  .tab .close { opacity: 0; font-size: 11px; color: #6f6f8f; transition: opacity 0.15s; }
  .tab:hover .close { opacity: 1; }
  .tab .close:hover { color: #ff6b6b; }
  #new-tab {
    padding: 6px 12px;
    color: #4a4a6e;
    cursor: pointer;
    font-size: 16px;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  #new-tab:hover { color: #60a5fa; }
  #terminals { flex: 1; position: relative; min-height: 0; overflow: hidden; display: flex; }
  .term-container { flex: 1; overflow: hidden; cursor: text; display: none; }
  .term-container.active { display: block; }
  #mobile-input {
    display: none;
    background: #12121f;
    border-top: 1px solid #2a2a3e;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    flex-shrink: 0;
  }
  #mobile-input form { display: flex; gap: 6px; }
  #mobile-input input {
    flex: 1;
    background: #0a0a0a;
    border: 1px solid #2a2a3e;
    color: #e0e0e0;
    padding: 8px 10px;
    font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, monospace;
    font-size: 14px;
    border-radius: 4px;
    outline: none;
  }
  #mobile-input input:focus { border-color: #60a5fa; }
  #mobile-input button {
    background: #1a1a2e;
    border: 1px solid #2a2a3e;
    color: #9f9fbf;
    padding: 8px 14px;
    font-family: monospace;
    font-size: 14px;
    border-radius: 4px;
    cursor: pointer;
  }
  #mobile-input button:active { background: #2a2a3e; }
  .mobile #mobile-input { display: block; }
  .mobile .tab .close { opacity: 1; }
  .mobile #bar { padding: 4px 10px; font-size: 12px; }
  .mobile .tab { padding: 8px 12px; font-size: 12px; min-height: 36px; }
  .mobile .tab .close { padding: 0 4px; min-width: 20px; }
  .mobile #new-tab { padding: 8px 14px; font-size: 18px; min-height: 36px; }
  /* iOS Safari auto-zooms when an input has font-size < 16px on focus. */
  .mobile #mobile-input input { font-size: 16px; padding: 10px 12px; min-height: 44px; }
  .mobile #mobile-input button { font-size: 15px; padding: 10px 14px; min-height: 44px; min-width: 44px; }
  /* Hide secondary nav links on the smallest screens — keep just hermytt + status. */
  @media (max-width: 480px) {
    .mobile #bar .left a { display: none; }
    .mobile #bar .left #highlight-toggle { display: inline; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="bar">
  <div class="left">
    <span class="name">hermytt</span>
    <a href="/chat">chat</a>
    <a href="/admin">admin</a>
    <a href="#" onclick="(async()=>{try{await fetch('/auth/logout',{method:'POST',credentials:'same-origin'})}catch(e){};sessionStorage.removeItem('hermytt-token');location.href='/login'})();return false" style="color:#4a4a6e">logout</a>
    <span id="highlight-toggle" style="cursor:pointer;color:#4a4a6e;transition:color 0.15s" title="syntax highlighting">&#x2728;</span>
  </div>
  <span><span class="dot" id="status"></span><span id="status-text">ready</span></span>
</div>
<div id="tabs"><div id="new-tab" title="new session">+</div></div>
<div id="terminals"></div>
<div id="mobile-input">
  <form id="mobile-form">
    <input type="text" id="mobile-text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type command...">
    <button type="submit">&#x23CE;</button>
    <button type="button" id="btn-ctrl-c" style="color:#ff6b6b">^C</button>
    <button type="button" id="btn-tab">&#x21E5;</button>
  </form>
</div>
<script type="module" src="/terminal.js"></script>
</body>
</html>
