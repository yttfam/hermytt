<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060610">
<title>hermytt command center</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #060610; --bg-card: #0c0c1a; --bg-header: #10102a;
  --border: #1a1a3e; --border-bright: #2a2a5e;
  --text: #c8c8e0; --text-dim: #5a5a7e; --text-muted: #3a3a5e;
  --blue: #4a8af4; --green: #3ede7a; --red: #f06060;
  --yellow: #e8b030; --cyan: #30d0d0; --purple: #a070f0;
  --font: 'JetBrains Mono', monospace;
}
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 12px; min-height: 100vh; line-height: 1.5; }
a { color: var(--blue); text-decoration: none; }

/* Header */
#hdr { background: var(--bg-header); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
#hdr .logo { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: 1px; }
#hdr .logo span { color: var(--text-muted); font-weight: 300; }
#hdr nav { display: flex; gap: 16px; font-size: 11px; }
#hdr nav a { color: var(--text-dim); transition: color 0.15s; }
#hdr nav a:hover { color: var(--blue); }

/* Status strip */
#strip { background: var(--bg-header); border-bottom: 1px solid var(--border); padding: 8px 20px; display: flex; gap: 24px; font-size: 11px; color: var(--text-dim); }
.s-item { display: flex; align-items: center; gap: 6px; }
.s-val { color: var(--text); font-weight: 500; }
.pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* Grid layout */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); margin: 1px; }
.grid > .full { grid-column: 1 / -1; }
.panel { background: var(--bg-card); padding: 0; }
.panel-hdr { padding: 8px 14px; background: var(--bg-header); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); }
.panel-body { padding: 10px 14px; min-height: 80px; }

/* Tables */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 4px 8px; color: var(--text-muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); font-weight: 400; }
td { padding: 6px 8px; border-bottom: 1px solid rgba(26,26,62,0.5); font-size: 11px; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(74,138,244,0.03); }
.empty-row { color: var(--text-muted); font-style: italic; }

/* Dots */
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 6px; flex-shrink: 0; }
.dot-on { background: var(--green); box-shadow: 0 0 4px var(--green); }
.dot-off { background: #333; }
.dot-warn { background: var(--yellow); }

/* Role badges */
.role { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 500; letter-spacing: 0.3px; }
.role-shell { background: rgba(62,222,122,0.1); color: var(--green); border: 1px solid rgba(62,222,122,0.2); }
.role-renderer { background: rgba(74,138,244,0.1); color: var(--blue); border: 1px solid rgba(74,138,244,0.2); }
.role-highlighter { background: rgba(160,112,240,0.1); color: var(--purple); border: 1px solid rgba(160,112,240,0.2); }
.role-sandbox { background: rgba(48,208,208,0.1); color: var(--cyan); border: 1px solid rgba(48,208,208,0.2); }
.role-bot { background: rgba(232,176,48,0.1); color: var(--yellow); border: 1px solid rgba(232,176,48,0.2); }
.role-parser { background: rgba(240,150,60,0.1); color: #f0963c; border: 1px solid rgba(240,150,60,0.2); }
.role-gateway { background: rgba(255,99,132,0.1); color: #ff6384; border: 1px solid rgba(255,99,132,0.2); }
.role-messenger { background: rgba(48,208,208,0.1); color: var(--cyan); border: 1px solid rgba(48,208,208,0.2); }

/* Gateway panel */
.gw-input, .gw-select, .gw-textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 5px 7px; font-family: var(--font); font-size: 11px; border-radius: 3px; outline: none; width: 100%; }
.gw-input:focus, .gw-select:focus, .gw-textarea:focus { border-color: var(--blue); }
.gw-textarea { resize: vertical; min-height: 90px; line-height: 1.4; }
.gw-lbl { display: block; font-size: 10px; color: var(--text-dim); margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.3px; }
.gw-tab { background: transparent; border: none; color: var(--text-dim); padding: 6px 12px; font-family: var(--font); font-size: 11px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.gw-tab:hover { color: var(--text); }
.gw-tab.active { color: var(--text); border-bottom-color: var(--blue); }
.gw-tab.disabled { color: var(--text-muted); }
.gw-tab.disabled::after { content: ' ·'; color: var(--text-muted); }
.gw-chk { display: flex; align-items: center; gap: 6px; padding: 4px 0; color: var(--text); font-size: 11px; cursor: pointer; user-select: none; }
.gw-chk input { cursor: pointer; accent-color: var(--blue); }
.gw-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 8px; }
.gw-row.wide { grid-column: 1 / -1; }
.gw-meta-row { display: flex; gap: 16px; font-size: 11px; color: var(--text-dim); flex-wrap: wrap; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.gw-resp { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 3px; font-size: 11px; line-height: 1.5; max-height: 340px; overflow: auto; white-space: pre-wrap; font-family: var(--font); }

/* Chat layout */
.gw-chat-grid { display: grid; grid-template-columns: 240px 1fr; gap: 10px; height: 480px; }
.gw-chat-side { background: var(--bg); border: 1px solid var(--border); border-radius: 3px; overflow: auto; }
.gw-chat-side-row { padding: 6px 8px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 11px; line-height: 1.3; }
.gw-chat-side-row:hover { background: var(--bg-header); }
.gw-chat-side-row.selected { background: rgba(74,138,244,0.08); border-left: 2px solid var(--blue); padding-left: 6px; }
.gw-chat-side-row .preview { color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gw-chat-side-row .meta { color: var(--text-muted); font-size: 10px; margin-top: 2px; display: flex; justify-content: space-between; }
.gw-chat-main { display: flex; flex-direction: column; min-height: 0; }
.gw-chat-msgs { flex: 1; overflow: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 10px; font-size: 11px; line-height: 1.55; min-height: 0; }
.gw-chat-empty { color: var(--text-muted); font-style: italic; text-align: center; padding: 40px 12px; }
.gw-chat-msg { margin-bottom: 12px; }
.gw-chat-msg .role { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 3px; display: flex; gap: 8px; align-items: baseline; }
.gw-chat-msg .role .model { color: var(--text-dim); text-transform: none; letter-spacing: 0; font-size: 10px; }
.gw-chat-msg.user .role { color: var(--blue); }
.gw-chat-msg.assistant .role { color: var(--green); }
.gw-chat-msg .content { white-space: pre-wrap; word-break: break-word; }
.gw-chat-msg .tool-chip { display: inline-block; background: rgba(160,112,240,0.12); color: var(--purple); border: 1px solid rgba(160,112,240,0.3); border-radius: 3px; padding: 0 6px; font-size: 10px; margin: 0 2px; vertical-align: baseline; }
.gw-chat-msg .tool-uses { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.gw-chat-msg .tool-uses .tu { background: rgba(160,112,240,0.06); border: 1px solid rgba(160,112,240,0.2); border-radius: 3px; padding: 1px 6px; font-size: 10px; color: var(--text-dim); }
.gw-chat-msg .tool-uses .tu strong { color: var(--purple); margin-right: 4px; }
.gw-chat-msg .thinking { background: rgba(232,176,48,0.06); border-left: 2px solid var(--yellow); padding: 2px 6px; color: var(--text-dim); font-style: italic; font-size: 10px; }
.gw-chat-send { display: flex; gap: 6px; margin-top: 8px; align-items: end; }
.gw-chat-send textarea { flex: 1; min-height: 38px; max-height: 120px; }
.gw-chat-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 11px; color: var(--text-dim); }
.gw-chat-toolbar .ctx { color: var(--text-dim); font-size: 10px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gw-chat-toolbar .warn { color: var(--yellow); }

/* Session names */
.session-name { cursor: text; border-bottom: 1px dashed var(--border); padding-bottom: 1px; }
.session-name:hover { border-color: var(--accent); }

/* Clickable service rows */
tr.svc-configurable { cursor: pointer; }
tr.svc-configurable:hover td { background: rgba(74,138,244,0.06); }

/* Service panel */
.svc-status { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 3px; font-size: 11px; }
.svc-status.idle { color: var(--green); }
.svc-status.thinking { color: var(--yellow); }
.svc-status.tool_use { color: var(--cyan); }

/* Buttons */
.btn { background: var(--bg-header); border: 1px solid var(--border); color: var(--text-dim); padding: 4px 10px; font-family: var(--font); font-size: 10px; border-radius: 3px; cursor: pointer; transition: all 0.1s; letter-spacing: 0.3px; }
.btn:hover { border-color: var(--border-bright); color: var(--text); }
.btn-blue { border-color: rgba(74,138,244,0.3); color: var(--blue); }
.btn-blue:hover { background: rgba(74,138,244,0.1); border-color: var(--blue); }
.btn-red { border-color: rgba(240,96,96,0.3); color: var(--red); }
.btn-red:hover { background: rgba(240,96,96,0.1); }
.btn-yellow { border-color: rgba(232,176,48,0.3); color: var(--yellow); }
.btn-yellow:hover { background: rgba(232,176,48,0.1); }

/* Toggle */
.toggle { position: relative; width: 28px; height: 14px; display: inline-block; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle .sl { position: absolute; inset: 0; background: #1a1a3e; border-radius: 14px; cursor: pointer; transition: 0.2s; }
.toggle .sl:before { content: ''; position: absolute; width: 10px; height: 10px; left: 2px; bottom: 2px; background: #555; border-radius: 50%; transition: 0.2s; }
.toggle input:checked + .sl { background: rgba(74,138,244,0.3); }
.toggle input:checked + .sl:before { transform: translateX(14px); background: var(--blue); }

/* Exec */
.exec-row { display: flex; gap: 6px; }
.exec-row input { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; font-family: var(--font); font-size: 11px; border-radius: 3px; outline: none; }
.exec-row input:focus { border-color: var(--blue); }
#exec-out { margin-top: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 8px 10px; font-size: 11px; white-space: pre-wrap; display: none; max-height: 200px; overflow-y: auto; color: var(--text-dim); }

/* Meta tags */
.meta-tag { display: inline-block; padding: 0 4px; background: rgba(255,255,255,0.03); border-radius: 2px; font-size: 10px; color: var(--text-muted); margin-right: 3px; }

/* Modal */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
.modal-bg.active { display: flex; }
.modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 20px; width: 400px; max-width: 90vw; }
.modal.wide { width: 640px; }
.modal h3 { font-size: 13px; color: var(--text); margin-bottom: 14px; font-weight: 500; }
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 10px; color: var(--text-dim); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
.field input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 8px; font-family: var(--font); font-size: 11px; border-radius: 3px; outline: none; }
.field input:focus { border-color: var(--blue); }
.field .hint { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
.field .error { font-size: 10px; color: var(--red); margin-top: 2px; }
.modal-actions { display: flex; gap: 6px; margin-top: 14px; justify-content: flex-end; }

/* Banner */
.banner { font-size: 11px; padding: 6px 14px; display: none; border-bottom: 1px solid var(--border); }
.banner.ok { display: block; background: rgba(62,222,122,0.05); color: var(--green); }
.banner.warn { display: block; background: rgba(232,176,48,0.05); color: var(--yellow); }
.banner.err { display: block; background: rgba(240,96,96,0.05); color: var(--red); }

/* Scanline effect on header */
#hdr::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px); pointer-events: none; }
#hdr { position: relative; }

/* === Mobile === */
@media (max-width: 720px) {
  body { font-size: 13px; }
  #hdr { padding: 10px 12px; }
  #hdr .logo { font-size: 13px; }
  #hdr nav { gap: 12px; font-size: 12px; }
  #hdr nav span#whoami, #hdr nav a[onclick*="logout"] { display: none; }

  /* Status strip wraps + stacks. Hide secondary stat items, keep status + sessions count. */
  #strip { padding: 8px 12px; gap: 12px; flex-wrap: wrap; }
  .s-item { font-size: 11px; }

  /* Single-column grid on phones — every panel becomes full width. */
  .grid { grid-template-columns: 1fr; }
  .panel { min-width: 0; }
  .panel-body { padding: 8px 10px; min-height: 0; }
  .panel-hdr { padding: 8px 10px; font-size: 11px; }

  /* Tables: drop the dense desktop padding, allow horizontal scroll if a row's still too wide. */
  td, th { padding: 8px 6px; font-size: 12px; }
  td .btn { padding: 6px 10px; font-size: 11px; min-height: 36px; }

  /* Family table: hide the host column on phones (the name already encodes it). */
  #family-table td:nth-child(4),
  table tr th:nth-child(4):empty { display: none; }

  /* Modals: full-screen on phones for easier scrolling, bigger inputs. */
  .modal { width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh; border-radius: 0; padding: 16px; overflow: auto; }
  .modal.wide { width: 100vw; }
  .field input, .field select { font-size: 16px; padding: 10px; min-height: 44px; }
  .modal-actions { position: sticky; bottom: 0; background: var(--bg-card); padding-top: 10px; }
  .modal-actions .btn { min-height: 44px; padding: 10px 14px; font-size: 13px; }

  /* Buttons across the UI become finger-friendly. */
  .btn { min-height: 36px; padding: 7px 12px; font-size: 11px; }

  /* Nested gateway/messenger sub-tables can get squashy — let them scroll horizontally if needed. */
  .panel-body table { display: block; overflow-x: auto; white-space: nowrap; }
  .panel-body table td, .panel-body table th { white-space: normal; }

  /* Gateway panel inputs: typing in chat tab, model fields, etc. */
  .gw-input, .gw-select, .gw-textarea { font-size: 16px; min-height: 38px; }
  .gw-row { grid-template-columns: 1fr; }
  .gw-chat-grid { grid-template-columns: 1fr; height: auto; }
}
</style>
</head>
<body>
<div id="hdr">
  <div class="logo">HERMYTT <span>command center</span></div>
  <nav><a href="/">terminal</a> <a href="/chat">chat</a> <a href="/admin">admin</a> <span id="whoami" style="color:#5a5a7e"></span> <a href="#" onclick="logout();return false" style="color:#5a5a7e">logout</a></nav>
</div>
<div id="strip">
  <div class="s-item"><div class="pulse"></div> <span id="s-status">connecting</span></div>
  <div class="s-item">sessions <span class="s-val" id="s-sessions">0</span></div>
  <div class="s-item">services <span class="s-val" id="s-services">0</span></div>
  <div class="s-item">shell <span class="s-val" id="s-shell">-</span></div>
</div>
<div id="banner-area" class="banner"></div>

<div class="grid">
  <!-- Family / Services -->
  <div class="panel full">
    <div class="panel-hdr">Family<span id="svc-count"></span> <button class="btn btn-blue" id="btn-add-host" style="font-size:10px">+ add host</button></div>
    <div class="panel-body" style="padding:0">
      <table>
        <thead><tr><th></th><th>name</th><th>role</th><th>host</th><th>mode</th><th>last seen</th></tr></thead>
        <tbody id="family-table"></tbody>
      </table>
    </div>
  </div>

  <!-- Sessions -->
  <div class="panel">
    <div class="panel-hdr">Sessions <span style="display:flex;gap:6px"><button class="btn btn-blue" id="btn-new-session" style="font-size:10px">+ new</button><button class="btn btn-red" id="btn-kill-all" style="font-size:10px" title="Kill every session — useful after a stale-shell flood post-restart">kill all</button></span></div>
    <div class="panel-body" style="padding:0">
      <table>
        <thead><tr><th></th><th>id</th><th></th></tr></thead>
        <tbody id="sessions-table"></tbody>
      </table>
    </div>
  </div>

  <!-- Quick Exec -->
  <div class="panel">
    <div class="panel-hdr">Exec</div>
    <div class="panel-body">
      <div class="exec-row">
        <input type="text" id="exec-input" placeholder="$ " autocomplete="off" spellcheck="false">
        <button class="btn btn-blue" id="btn-exec">run</button>
      </div>
      <div id="exec-out"></div>
    </div>
  </div>

  <!-- Users -->
  <div class="panel full">
    <div class="panel-hdr">
      Users <span id="users-count" style="color:var(--text-muted)"></span>
      <button class="btn btn-blue" id="btn-add-user" style="font-size:10px">+ add user</button>
    </div>
    <div class="panel-body" style="padding:0">
      <table><tbody id="users-table"></tbody></table>
    </div>
  </div>

  <!-- Transports -->
  <div class="panel full">
    <div class="panel-hdr">
      Transports
      <div style="display:flex;gap:6px">
        <button class="btn btn-blue" id="btn-save-transports">save</button>
        <button class="btn btn-yellow" id="btn-restart" style="display:none">restart</button>
      </div>
    </div>
    <div class="panel-body" style="padding:0">
      <table><tbody id="transports-table"></tbody></table>
    </div>
  </div>
</div>

<!-- Edit modal -->
<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal-box">
    <h3 id="modal-title">Edit</h3>
    <div id="modal-fields"></div>
    <div class="modal-actions">
      <button class="btn" id="modal-cancel">cancel</button>
      <button class="btn btn-blue" id="modal-save">save</button>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
</body>
</html>
